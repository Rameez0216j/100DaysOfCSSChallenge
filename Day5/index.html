<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./style.css" />
        <title>Document</title>
    </head>
    <body>
        <div class="main">
            <div class="frame">
                <div class="chart">
                    <div class="info">
                        <div class="title_week">
                            <div class="large_text report">Weekly Report</div>
                            <div class="small_text">01.Feb - 07.Feb</div>
                        </div>
                        <div class="revenue_val">
                            <div class="small_text">Revenue</div>
                            <div class="large_text">$ 3621.79</div>
                        </div>
                    </div>
                    <div class="plot">
                        <div class="labels">
                            <div class="indicators">
                                <span class="color1"></span
                                ><span class="text">Views</span>
                            </div>
                            <div class="indicators">
                                <span class="color2"></span
                                ><span class="text">Purchases</span>
                            </div>
                        </div>
                        <div class="graph">
                            <div class="line"></div>
                            <div class="line"></div>
                            <div class="line"></div>
                        </div>
                        <div class="week">
                            <div class="days">Mon</div>
                            <div class="days">Tue</div>
                            <div class="days">Wed</div>
                            <div class="days">Thu</div>
                            <div class="days">Fri</div>
                            <div class="days">Sat</div>
                            <div class="days">Sun</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="./index.js"></script>
    </body>
</html>
